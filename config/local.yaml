environment: local

server:
  api_bind: "127.0.0.1:3000"
  worker_bind: "127.0.0.1:3001"
  mcp_bind: "127.0.0.1:3002"

postgres: "postgres://proofplane:proofplane@127.0.0.1:5432/proofplane"

pubsub:
  project_id: "proofplane-local"
  subscriptions:
    worker: "proofplane-worker"
    worker_push_endpoint: "http://host.docker.internal:3001/pubsub/messages"
    worker_max_delivery_attempts: 5

spicedb:
  endpoint: "http://127.0.0.1:50051"
  preshared_key: "proofplane-local-spicedb-key"
  schema_path: "authz/spicedb/proofplane.zed"

object_storage:
  backend: "filesystem"
  root: ".local/storage"

scanner:
  clamd_address: "127.0.0.1:3310"
  connection_timeout_ms: 1000
  scan_timeout_ms: 30000

uploads:
  max_attachment_bytes: 26214400

observability:
  log_format: "pretty"
  default_filter: "debug"

worker:
  concurrency: 4
  retry_attempts: 3
  shutdown_grace_seconds: 30

health:
  live_path: "/livez"
  ready_path: "/readyz"
  dependency_timeout_ms: 1000

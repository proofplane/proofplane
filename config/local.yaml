environment: local

server:
  api_bind: "127.0.0.1:3000"
  worker_bind: "127.0.0.1:3001"
  mcp_bind: "127.0.0.1:3002"
  public_api_base_url: "http://127.0.0.1:3000"

postgres: "postgres://proofplane:proofplane@127.0.0.1:5432/proofplane"

pubsub:
  project_id: "proofplane-local"
  subscriptions:
    worker: "proofplane-worker"
    worker_push_endpoint: "http://host.docker.internal:3001/pubsub/messages"
    worker_max_delivery_attempts: 5

auth0:
  issuer: "https://dev-ctgrkbdrbodz4azi.us.auth0.com/"
  audience: "https://api.proofplane.com"
  jwks_url: "https://dev-ctgrkbdrbodz4azi.us.auth0.com/.well-known/jwks.json"
  upstream_oauth:
    client_id: "local-proofplane-oauth-client"
    client_secret: "local-proofplane-oauth-client-secret-change-me"
    callback_path: "/oauth/auth0/callback"
  auditor_portal:
    client_id: "local-proofplane-auditor-client"
    client_secret: "local-proofplane-auditor-client-secret-change-me"
    callback_path: "/auditor-access/auth0/callback"
    connection: "email"

paseto:
  download:
    active_key_id: "local-download-001"
    keys:
      - id: "local-download-001"
        secret: "k4.local.mKj2EzeLOuNBNlHNX6oLl76yopCc1K9YvWQVIo1xYEs"
  upload_grant:
    active_key_id: "local-upload-grant-001"
    keys:
      - id: "local-upload-grant-001"
        secret: "k4.local.cMO6bYZvmIk4f5OppaRjsRYQE0frbAM7qD4cDAO8HxY"
  mcp_oauth:
    active_key_id: "local-mcp-oauth-001"
    keys:
      - id: "local-mcp-oauth-001"
        secret: "k4.local.BMyQa9GmLofWmmvtYCedLfePwmuJsMgNn96nW1PtMp0"

workspace_invitations:
  landing_portal_base_url: "http://127.0.0.1:5173"
  active_key_id: "local-workspace-invitation-001"
  keys:
    - id: "local-workspace-invitation-001"
      secret: "k4.local.mKj2EzeLOuNBNlHNX6oLl76yopCc1K9YvWQVIo1xYEs"

mail:
  adapter: "local_stdout"

object_storage:
  backend: "filesystem"
  root: ".local/storage"

scanner:
  clamd_address: "127.0.0.1:3310"
  connection_timeout_ms: 1000
  scan_timeout_ms: 30000

uploads:
  max_document_bytes: 26214400

observability:
  log_format: "pretty"
  default_filter: "debug"

worker:
  concurrency: 4
  retry_attempts: 3
  shutdown_grace_seconds: 30

mcp:
  shutdown_grace_seconds: 30
  # For loopback dev this is the local MCP URL. For hosted-client (Claude /
  # Cowork) testing, set it to the MCP ngrok tunnel URL + /mcp — see
  # docs/claude-cowork-connector-testing.md.
  resource: http://127.0.0.1:3002/mcp
  # Hosts allowed in the inbound Host header for the MCP transport (rmcp
  # DNS-rebinding protection). Empty keeps the secure loopback-only default; add
  # the MCP tunnel host (e.g. "abc123.ngrok.app") when testing hosted clients.
  allowed_hosts: []

health:
  live_path: "/livez"
  ready_path: "/readyz"
  dependency_timeout_ms: 1000

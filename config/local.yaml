environment: local

server:
  api_bind: "127.0.0.1:3000"
  worker_bind: "127.0.0.1:3001"
  mcp_bind: "127.0.0.1:3002"

postgres: "postgres://proofplane:proofplane@127.0.0.1:5432/proofplane"

pubsub:
  project_id: "proofplane-local"
  emulator_host: "127.0.0.1:8085"
  topics:
    outbox: "proofplane-outbox"
    dead_letter: "proofplane-dead-letter"
  subscriptions:
    worker: "proofplane-worker"

spicedb:
  endpoint: "http://127.0.0.1:50051"
  preshared_key: "proofplane-local-spicedb-key"
  schema_path: "authz/spicedb/proofplane.zed"

object_storage:
  backend: "filesystem"
  root: ".local/storage"

observability:
  log_format: "pretty"
  default_filter: "debug"

auth:
  api_key_header: "x-proofplane-api-key"
  credential_hash_pepper: "proofplane-local-pepper"

worker:
  concurrency: 4
  retry_attempts: 3
  shutdown_grace_seconds: 30

health:
  live_path: "/livez"
  ready_path: "/readyz"
  dependency_timeout_ms: 1000

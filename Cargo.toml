[package]
name = "proofplane"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "proofplane"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = false

[dependencies]

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt"] }

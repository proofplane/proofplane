[package]
name = "proofplane"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "proofplane"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[dependencies]
axum = "0.8.9"
config = { version = "0.15", default-features = false, features = ["yaml"] }
deadpool-postgres = "0.14.1"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
refinery = { version = "0.9.1", features = ["tokio-postgres"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-postgres = "0.7.17"
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

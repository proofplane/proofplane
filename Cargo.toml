[package]
name = "proofplane"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "proofplane"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "dequeuer"
path = "src/bin/dequeuer.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

# Local development only. The Dockerfile builds the five production commands
# by name, so this one cannot reach the release image.
[[bin]]
name = "pubsub-init"
path = "src/bin/pubsub_init.rs"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
config = { version = "0.15", default-features = false, features = ["yaml"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
crc32c = "0.6"
crc32fast = "1.5.0"
deadpool-postgres = "0.14.1"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.4.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
jwtk = { version = "0.5", features = ["openssl"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
mime = "0.3"
rmcp = { version = "1.7.0", features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
prost-types = "0.14"
refinery = { version = "0.9.1", features = ["tokio-postgres"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tokio-postgres = { version = "0.7.17", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
sfv = "0.14.0"
google-cloud-pubsub = { version = "1.7.1", package = "gcloud-pubsub" }
google-cloud-gax = { version = "1.4.0", package = "gcloud-gax" }
gcloud-auth = "1.3.0"
google-cloud-googleapis = { version = "1.3.0", package = "gcloud-googleapis", features = ["pubsub"] }
google-cloud-storage = "1.17.0"
google-cloud-wkt = "1.7.0"
pasetors = "=0.7.8"
reqwest = "0.13"
anyhow = { version = "1.0.104", features = ["std", "backtrace"] }

[dev-dependencies]
axum-test = "20"
# Both default to the rustls `ring` provider, while every non-test dependency
# that speaks TLS (gcloud-auth, gcloud-pubsub, google-cloud-storage, reqwest)
# uses `aws-lc-rs`. Cargo unifies features across normal and dev dependencies,
# so the defaults turn on both providers in a test build. rustls then refuses to
# choose one and panics on the first TLS handshake. Pin these to the provider
# the rest of the graph already uses.
testcontainers = { version = "0.27", default-features = false, features = ["aws-lc-rs"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres", "aws-lc-rs"] }

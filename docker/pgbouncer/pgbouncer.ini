; Local stand-in for the Supabase Supavisor transaction pooler that production
; runtime traffic goes through. See docs/epics/production-deployment/spec.md.

[databases]
; Wildcard so both the `proofplane` development database and the
; `proofplane_integration_v2` database the test suite drops and recreates on
; every run resolve without editing this file.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = proofplane
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20

; Supavisor transaction mode does not support prepared statements, so neither
; does this. PgBouncer 1.21+ could support them by raising this above zero, but
; that would make the local pooler MORE permissive than production and hide the
; breakage this stack exists to catch. Leave it at 0.
max_prepared_statements = 0

; DISCARD ALL is a session-pooling reset. It must stay empty in transaction
; mode, where there is no session state to discard between transactions.
server_reset_query =
server_reset_query_always = 0

ignore_startup_parameters = extra_float_digits,search_path

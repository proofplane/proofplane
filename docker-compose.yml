name: proofplane

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proofplane
      POSTGRES_USER: proofplane
      POSTGRES_PASSWORD: proofplane
    ports:
      - "5432:5432"
    volumes:
      - proofplane-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofplane -d proofplane"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  pubsub:
    image: ghcr.io/jeffijoe/deltio:latest
    ports:
      - "8085:8085"
    # deltio pushes via push subscriptions to a worker running on the host
    # (i.e., a CI job runner). This means the deltio container needs a DNS
    # name where it can reach the worker. On Mac, this is redundant because
    # Docker Desktop injects it, but on Linux it's necessary.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8085"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  clamav:
    image: clamav/clamav-debian:1.4.3
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  proofplane-postgres-data:
